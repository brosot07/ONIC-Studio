name: Deploy database and server functions

# Runs after changes reach main, or by hand. Every run waits for a required reviewer on the
# `production` environment, which holds the only Supabase credentials.
on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    # Secrets are given only to the steps that talk to Supabase, never to npm.
    env:
      PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Check settings
        run: |
          [[ "$PROJECT_ID" =~ ^[a-z]{20}$ ]] || { echo "SUPABASE_PROJECT_ID looks wrong"; exit 1; }
          if [[ -n "$SITE_URL" ]]; then
            [[ "$SITE_URL" =~ ^https://[a-z0-9.-]+$ ]] || { echo "SITE_URL must look like https://studio.example.com"; exit 1; }
          fi

      - name: Link project
        run: npx supabase link --project-ref "$PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Apply database changes
        run: npx supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Deploy server functions
        run: npx supabase functions deploy admin-users --project-ref "$PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Apply sign-in settings (needs the app's web address in SITE_URL)
        if: env.SITE_URL != ''
        run: |
          # config.toml carries local addresses; swap in production (validated above) before pushing.
          sed -i "s#^site_url = .*#site_url = \"$SITE_URL\"#" supabase/config.toml
          sed -i "s#^additional_redirect_urls = .*#additional_redirect_urls = [\"$SITE_URL\"]#" supabase/config.toml
          npx supabase config push --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Security and performance advisors (must be clean)
        run: npx supabase db advisors --linked --fail-on warn
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
